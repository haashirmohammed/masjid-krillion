<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masjid Krillion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the masjid fills the whole screen. Three glass boxes float over it: the score top right, the question along the bottom, and the move-on box that takes the question's place once it is settled. The result of each prompt shows mid-screen, just above the cat. Single dark look on purpose. */
:root{
  color-scheme:dark;
  --night:#0b1736; --dusk:#3b2a5e; --glass:rgba(8,38,26,.88); --line:#2f6d50;
  --tile:#52b788; --lamp:#f2c14e; --mint:#95d5b2; --deep:#07291c;
  --g1:#e6f7ec; --g2:#bfe9cf; --g3:#86d4a8; --g4:#1d5e40; --g5:#023d2b;
  --ink:#f3efe4; --muted:#a8c9b8; --bad:#ef7d6f;
  --display:"Press Start 2P","Courier New",monospace; --body:"Pixelify Sans","Courier New",monospace;
  --cat-top:50vh; --mid-top:76px;
}
@media (min-width:800px){:root{--mid-top:16px}}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--night)}
body{color:var(--ink);font:16px/1.5 var(--body);overflow:hidden}
.scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(var(--night) 0%,#1a2152 60%,var(--dusk) 100%)}
#world{position:absolute;left:0;top:0;width:3400px;height:300px;max-width:none;overflow:visible;transform-origin:0 0;transition:transform 1.1s ease}
#me{transition:transform 1.1s ease}
.box{background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(2,20,12,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.score{position:fixed;z-index:3;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));min-width:72px;padding:12px 16px;text-align:center;font:400 20px/1 var(--display);color:var(--mint);font-variant-numeric:tabular-nums;transition:background .4s,color .4s,border-color .4s,box-shadow .4s}
.mid{position:fixed;left:0;right:0;top:calc(var(--mid-top) + env(safe-area-inset-top,0px));height:calc(var(--cat-top) - var(--mid-top) - 16px - env(safe-area-inset-top,0px));min-height:140px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.low{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mid > *,.low > *{pointer-events:auto;width:100%;max-width:540px}
.mid > *{max-height:100%}
.low > *{max-height:300px}
@media (min-width:600px){.low > *{max-height:250px}}
.card{min-height:0;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.card > *{flex:none}
h1{margin:0;font:400 18px/1.5 var(--display)}
.card h2{margin:0;font:600 clamp(20px,4.6vw,24px)/1.25 var(--body);text-wrap:balance}
#end h2{font:400 15px/1.6 var(--display)}
.card p,.result p{margin:0}
.muted{color:var(--muted);font-size:14px}
.tag{align-self:flex-start;font:400 9px/1.6 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--deep);background:var(--tile);border-radius:99px;padding:3px 10px}
.row{display:flex;gap:8px}
input[type=text]{flex:1 1 0;min-width:0;font:500 17px var(--body);color:var(--ink);background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
button{flex:none;font:600 17px var(--body);border-radius:10px;padding:12px 16px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.go{background:var(--mint);border-color:var(--mint);color:var(--deep)}
button:hover{filter:brightness(1.1)}
button:disabled,input:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.bar{height:6px;border-radius:3px;background:var(--deep);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--tile)}
.bar i.low-time{background:var(--bad)}
#fb{font-weight:600;color:var(--bad)}
#fb:empty{display:none}
.tiers{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tiers li{border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.tiers b{color:var(--mint);font:400 9px var(--display);margin-right:6px}
.mid > .result{width:auto;min-width:min(260px,100%);padding:16px 28px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.result .tag{align-self:center}
.result.miss .tag{background:var(--bad)}
.r-ans{font:600 clamp(20px,5vw,26px)/1.2 var(--body);text-wrap:balance}
.r-pts{font:400 30px/1 var(--display);color:inherit}
/* Each tier tints the result box and the score badge green: the more common the answer, the lighter the green.
   Sawm and Hajj, the rare ones, are much darker, with Hajj a deep emerald. Rarer tiers also get bigger and louder: Zakat gets a border, Sawm shakes, Hajj slams in and shakes harder. */
.result{animation:pop .3s ease-out}
.result.t0 .r-pts{font-size:24px;color:var(--muted)}
.result.t10,.result.t30,.result.t60{color:var(--deep)}
.result.t10{background:var(--g1);border-color:#fff}
.result.t10 .r-pts{font-size:24px}
.result.t30{background:var(--g2);border-color:var(--g1)}
.result.t30 .r-pts{font-size:30px}
.result.t60{background:var(--g3);border:2px solid var(--g2)}
.result.t60 .r-pts{font-size:38px}
.result.t10 .tag,.result.t30 .tag,.result.t60 .tag{background:var(--deep);color:var(--g1)}
.result.t10 .muted,.result.t30 .muted,.result.t60 .muted{color:rgba(7,41,28,.72)}
.result.t85{background:var(--g4);color:#fff;padding:20px 34px 22px;border:3px solid #3f8f6a;animation:pop .3s ease-out,shake .45s .25s 3}
.result.t85 .r-pts{font-size:46px;text-shadow:3px 3px 0 #0b2e1f}
.result.t100{background:var(--g5);color:#fff;padding:24px 40px 26px;border:4px solid #2f7d5c;animation:bigpop .45s cubic-bezier(.2,1.6,.4,1),quakebox .5s .3s 5}
.result.t100 .r-pts{font-size:clamp(46px,12vw,64px);text-shadow:4px 4px 0 #00170f}
.result.t100 .r-ans{font-size:clamp(22px,6vw,30px)}
.result.t85 .tag,.result.t100 .tag{background:#fff;color:#00664f}
.result.t100 .tag{font-size:12px;padding:6px 12px}
.result.t85 .muted,.result.t100 .muted{color:rgba(255,255,255,.85)}
.score.s10{background:var(--g1);color:var(--deep);border-color:#fff}
.score.s30{background:var(--g2);color:var(--deep);border-color:var(--g1)}
.score.s60{background:var(--g3);color:var(--deep);border-color:var(--g2)}
.score.s85{background:var(--g4);color:#fff;border-color:#3f8f6a}
.score.s100{background:var(--g5);color:#fff;border-color:#2f7d5c}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes bigpop{0%{opacity:0;transform:scale(.3) rotate(-8deg)}100%{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,1px) rotate(-1.5deg)}40%{transform:translate(5px,-1px) rotate(1.5deg)}60%{transform:translate(-4px,0) rotate(-1deg)}80%{transform:translate(4px,1px) rotate(1deg)}}
@keyframes quakebox{0%,100%{transform:scale(1.04)}15%{transform:translate(-12px,4px) rotate(-4deg) scale(1.08)}35%{transform:translate(12px,-5px) rotate(4deg) scale(1.1)}55%{transform:translate(-10px,-3px) rotate(-3deg) scale(1.08)}75%{transform:translate(10px,4px) rotate(3deg) scale(1.06)}}
.scene.quake{animation:scenequake .12s linear infinite}
@keyframes scenequake{0%,100%{transform:none}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-2px)}}
.fx{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.fx i{position:absolute;display:block}
.fx .flash{position:absolute;inset:0;background:radial-gradient(circle,#fff6d8 0%,rgba(242,193,78,.6) 45%,transparent 75%)}
#sprite{transform-box:fill-box;transform-origin:50% 100%}
.tw{animation:tw 2.2s steps(2) infinite}
@keyframes tw{50%{opacity:.1}}
.jets{animation:jets .5s steps(2) infinite}
@keyframes jets{50%{stroke-dashoffset:2.5}}
.low > .move{width:auto;min-width:min(340px,100%);padding:10px 10px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.res{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
td.n{font-variant-numeric:tabular-nums;color:var(--mint);font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#world,#me{transition:none}.result,.scene,.tw,.jets{animation:none!important}}
</style>
</head>
<body>


<div class="scene" id="scene" aria-hidden="true">
<svg id="world" viewBox="0 0 3400 300" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="box score" role="status" aria-label="Score"><span id="pts">0</span></div>

<main>
  <div class="mid">
    <section class="box result" id="result" role="status" hidden>
      <span class="tag" id="r-tier"></span>
      <p class="r-ans" id="r-ans"></p>
      <p class="r-pts" id="r-pts"></p>
      <p class="muted" id="r-place"></p>
    </section>

    <section class="box card" id="end" hidden>
      <h2 id="verdict"></h2>
      <p id="summary"></p>
      <div class="res"><table><thead><tr><th>Prompt</th><th>You said</th><th>Pts</th><th>Hajj answers</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </div>

  <div class="low">
    <section class="box card" id="start">
      <h1>Masjid Krillion</h1>
      <p>Seven prompts, 25 seconds each. Type one right answer. The rarer it is, the further the cat walks into the masjid.</p>
      <ul class="tiers" id="tiers"></ul>
      <div class="row"><button class="go" id="begin">Walk in</button></div>
    </section>

    <section class="box card" id="play" hidden>
      <span class="tag" id="tag">Hadith</span>
      <h2 id="q"></h2>
      <p class="muted" id="hint"></p>
      <div class="bar"><i id="time"></i></div>
      <form class="row" id="form" autocomplete="off">
        <input type="text" id="ans" aria-label="Your answer" placeholder="Type one answer" autocapitalize="off" spellcheck="false">
        <button class="go" id="submit">Submit</button>
        <button type="button" id="skip">Skip</button>
      </form>
      <p id="fb" role="status"></p>
    </section>

    <section class="box move" id="move" hidden>
      <span class="muted" id="m-count"></span>
      <button class="go" id="next">Next prompt</button>
    </section>
  </div>
</main>
<div class="fx" id="fx" aria-hidden="true"></div>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
